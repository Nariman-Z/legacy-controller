<!DOCTYPE html>
<html lang="en">
<head>
  <title>Weather Station — Creative Electronic</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/webp" href="assets/images/icon.webp">
  <link rel="stylesheet" href="assets/css/W3.css" type="text/css">
  <link rel="stylesheet" href="assets/css/raleway.css" type="text/css">
  <link rel="stylesheet" href="assets/css/font-awesome.min.css" type="text/css">
  <style>
    body, h1, h2, h3, h4, h5, h6 { font-family: "Raleway", sans-serif; }
    body, html { height: 100%; margin: 0; line-height: 1.8; background-color: #121212; color: #ffffff; }

    .bgimg-1 {
      background-position: center;
      background-size: cover;
      background-color: #0e0e0e;
      background-image: url('assets/images/background.webp');
      min-height: 100%;
      position: relative;
    }

    .hero-overlay {
      background: rgba(0, 0, 0, 0.72);
      min-height: 100vh;
      padding: 90px 24px 40px;
    }

    .w3-bar .w3-button { padding: 16px 20px; font-weight: 500; }
    .w3-bar { background-color: rgba(18, 18, 18, 0.95) !important; backdrop-filter: blur(8px); }

    .station-header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 36px;
    }

    .live-pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .weather-card {
      background: rgba(28, 28, 30, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .weather-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .card-icon {
      font-size: 2.4rem;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #94a3b8;
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-reading {
      font-size: 3rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
    }

    .card-unit {
      font-size: 1.4rem;
      font-weight: 500;
      vertical-align: super;
      margin-left: 4px;
      color: #cbd5e1;
    }

    /* Color Accents */
    .temp-card .card-icon, .temp-card .card-reading { color: #f59e0b; }
    .hum-card .card-icon, .hum-card .card-reading { color: #38bdf8; }
    .pres-card .card-icon, .pres-card .card-reading { color: #34d399; }
    .alti-card .card-icon, .alti-card .card-reading { color: #c084fc; }

    .last-updated {
      text-align: center;
      margin-top: 36px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <div class="w3-top">
    <div class="w3-bar w3-card" id="myNavbar">
      <a href="/" class="w3-bar-item w3-button w3-wide" title="Home">
        <i class="fa fa-home"></i> HOME
      </a>
      <div class="w3-right w3-hide-small">
        <a href="/dashboard" class="w3-bar-item w3-button"><i class="fa fa-sliders"></i> Dashboard</a>
        <a href="/weather" class="w3-bar-item w3-button"><i class="fa fa-thermometer-half"></i> Weather</a>
        <a href="/clock" class="w3-bar-item w3-button"><i class="fa fa-clock-o"></i> Clock</a>
      </div>
      <a href="javascript:void(0)" class="w3-bar-item w3-button w3-right w3-hide-large w3-hide-medium" onclick="toggleSidebar()">
        <i class="fa fa-bars"></i>
      </a>
    </div>
  </div>

  <!-- Mobile Sidebar -->
  <nav class="w3-sidebar w3-bar-block w3-black w3-card w3-animate-left w3-hide-medium w3-hide-large" style="display:none; z-index: 1000;" id="mySidebar">
    <a href="javascript:void(0)" onclick="closeSidebar()" class="w3-bar-item w3-button w3-large w3-padding-16"><i class="fa fa-times"></i> Close</a>
    <a href="/" onclick="closeSidebar()" class="w3-bar-item w3-button"><i class="fa fa-home"></i> Home</a>
    <a href="/dashboard" onclick="closeSidebar()" class="w3-bar-item w3-button"><i class="fa fa-sliders"></i> Dashboard</a>
    <a href="/weather" onclick="closeSidebar()" class="w3-bar-item w3-button"><i class="fa fa-thermometer-half"></i> Weather</a>
    <a href="/clock" onclick="closeSidebar()" class="w3-bar-item w3-button"><i class="fa fa-clock-o"></i> Clock</a>
  </nav>

  <header class="bgimg-1">
    <div class="hero-overlay">
      <div class="station-header">
        <h2 style="margin:0 0 6px; font-weight:700;"><i class="fa fa-cloud" style="color:#38bdf8;"></i> BME280 Weather Station</h2>
        <span style="color:#cbd5e1; font-size:0.95rem;">
          <span class="live-pulse"></span>Live Sensor Telemetry via Server-Sent Events (SSE)
        </span>
      </div>

      <div class="cards-grid">
        <!-- Temperature -->
        <div class="weather-card temp-card">
          <div class="card-icon"><i class="fa fa-thermometer-half"></i></div>
          <div class="card-title">Temperature</div>
          <div class="card-reading"><span id="temp">--.-</span><span class="card-unit">&deg;C</span></div>
        </div>

        <!-- Humidity -->
        <div class="weather-card hum-card">
          <div class="card-icon"><i class="fa fa-tint"></i></div>
          <div class="card-title">Humidity</div>
          <div class="card-reading"><span id="hum">--.-</span><span class="card-unit">%</span></div>
        </div>

        <!-- Pressure -->
        <div class="weather-card pres-card">
          <div class="card-icon"><i class="fa fa-tachometer"></i></div>
          <div class="card-title">Pressure</div>
          <div class="card-reading"><span id="pres">----.-</span><span class="card-unit" style="font-size:1.1rem;">hPa</span></div>
        </div>

        <!-- Altitude -->
        <div class="weather-card alti-card">
          <div class="card-icon"><i class="fa fa-area-chart"></i></div>
          <div class="card-title">Approx. Altitude</div>
          <div class="card-reading"><span id="alti">--.-</span><span class="card-unit" style="font-size:1.1rem;">m</span></div>
        </div>
      </div>

      <div class="last-updated">
        <i class="fa fa-refresh"></i> Telemetry updates automatically every 5 seconds. Last updated: <span id="update-time">Just now</span>
      </div>
    </div>
  </header>

  <script>
    var sidebar = document.getElementById("mySidebar");
    function toggleSidebar() { sidebar.style.display = (sidebar.style.display === 'block') ? 'none' : 'block'; }
    function closeSidebar() { sidebar.style.display = 'none'; }

    function updateTimestamp() {
      var now = new Date();
      document.getElementById("update-time").innerText = now.toLocaleTimeString();
    }

    // Fetch initial sensor status on page load
    fetch('/api/status').then(function(res) {
      if (res.ok) return res.json();
      throw new Error();
    }).then(function(data) {
      if (data.sensor && data.sensor.available) {
        document.getElementById("temp").innerText = parseFloat(data.sensor.temperature).toFixed(1);
        document.getElementById("hum").innerText = parseFloat(data.sensor.humidity).toFixed(1);
        document.getElementById("pres").innerText = parseFloat(data.sensor.pressure).toFixed(1);
        document.getElementById("alti").innerText = parseFloat(data.sensor.altitude).toFixed(1);
        updateTimestamp();
      }
    }).catch(function() {});

    if (!!window.EventSource) {
      var source = new EventSource('/events');

      source.addEventListener('temperature', function(e) {
        document.getElementById("temp").innerText = parseFloat(e.data).toFixed(1);
        updateTimestamp();
      }, false);

      source.addEventListener('humidity', function(e) {
        document.getElementById("hum").innerText = parseFloat(e.data).toFixed(1);
        updateTimestamp();
      }, false);

      source.addEventListener('pressure', function(e) {
        document.getElementById("pres").innerText = parseFloat(e.data).toFixed(1);
        updateTimestamp();
      }, false);

      source.addEventListener('altitude', function(e) {
        document.getElementById("alti").innerText = parseFloat(e.data).toFixed(1);
        updateTimestamp();
      }, false);
    }
  </script>
</body>
</html>
